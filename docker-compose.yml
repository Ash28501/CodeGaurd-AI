services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  codeguard:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      CODEGUARD_MODEL: qwen2.5-coder:7b
    depends_on:
      - ollama

volumes:
  ollama-models:

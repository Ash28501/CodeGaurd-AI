<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeGuard AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100">
    <div class="max-w-5xl mx-auto p-8">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-bold mb-3 text-emerald-500">🛡️ CodeGuard AI</h1>
            <p class="text-zinc-400">Local AI Code Reviewer • Powered by Ollama</p>
        </div>

        <form id="reviewForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Language</label>
                <select name="language" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-3">
                    <option value="Python">Python</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="TypeScript">TypeScript</option>
                    <option value="Java">Java</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Paste your code</label>
                <textarea name="code" rows="14" 
                          class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl p-5 font-mono text-sm resize-y"
                          placeholder="def calculate_sum(a, b): ..."></textarea>
            </div>

            <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-2xl font-semibold text-lg transition">
                Get Professional Code Review
            </button>
        </form>

        <div id="result" class="mt-12 hidden"></div>
    </div>

    <script>
        // Model output is untrusted: escape before inserting into the page.
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `<p class="text-center text-zinc-400">Reviewing code with local LLM... Please wait.</p>`;

            const res = await fetch('/review', { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok) {
                resultDiv.innerHTML = `<p class="text-center text-red-400">${esc(data.detail || 'Review failed')}</p>`;
                return;
            }
            const r = data.review;
            const colors = { critical: 'text-red-500', high: 'text-orange-400', medium: 'text-amber-300', low: 'text-zinc-400' };
            const issues = r.issues.map(i => `
                <li class="border border-zinc-800 rounded-xl p-4">
                    <div class="text-sm mb-1"><span class="${colors[i.severity]} font-semibold uppercase">${esc(i.severity)}</span>
                    · ${esc(i.category)}${i.line ? ` · line ${i.line}` : ''}</div>
                    <p>${esc(i.description)}</p>
                    <p class="text-emerald-300 text-sm mt-2">Fix: ${esc(i.suggestion)}</p>
                </li>`).join('');
            resultDiv.innerHTML = `
                <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">Review Results</h2>
                        <span class="text-3xl font-bold ${r.score >= 7 ? 'text-emerald-500' : 'text-amber-500'}">${r.score}/10</span>
                    </div>
                    <p class="text-lg mb-6">${esc(r.summary)}</p>
                    <ul class="space-y-3">${issues || '<li class="text-zinc-400">No issues found.</li>'}</ul>
                    ${r.refactored_code ? `<pre class="bg-black p-6 mt-6 rounded-2xl overflow-auto text-emerald-300 text-sm">${esc(r.refactored_code)}</pre>` : ''}
                </div>`;
        });
    </script>
</body>
</html>
